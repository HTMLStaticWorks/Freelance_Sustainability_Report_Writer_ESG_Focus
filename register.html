<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | EcoReport ESG</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <!-- CSS & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <style>
        body {
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            transition: var(--transition-slow);
        }
        [data-theme="light"] body {
            background: linear-gradient(135deg, #f0fdfa 0%, #e0f2f1 100%);
        }
        [data-theme="dark"] body {
            background: linear-gradient(135deg, #061e1c 0%, #0c0f16 100%);
        }
        .auth-card {
            background: var(--bg-white);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            color: var(--text-main);
            box-shadow: var(--shadow-lg);
            transition: var(--transition-slow);
        }
        [data-theme="dark"] .auth-card {
            background: rgba(15, 23, 42, 0.8) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .auth-logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .form-control, .form-select {
            background: var(--bg-light) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.2s ease;
        }
        [data-theme="dark"] .form-control, [data-theme="dark"] .form-select {
            background: rgba(255, 255, 255, 0.05) !important;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--teal) !important;
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.15) !important;
        }
        .btn-auth-primary {
            background-color: #D4A017;
            border: none;
            color: #000;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s ease;
        }
        .btn-auth-primary:hover {
            background-color: #e5ae1a;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(212, 160, 23, 0.3);
        }
        .text-accent {
            color: #D4A017;
            text-decoration: none;
            font-weight: 600;
        }
        .text-accent:hover {
            text-decoration: underline;
        }
        .form-select option {
            background-color: var(--bg-white);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="auth-brand">
                <div class="auth-logo-icon">
                    <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 2L4 8V24L16 30L28 24V8L16 2Z" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 10V22" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 14L22 10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 14L10 10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h2 class="fw-bold mb-0">EcoReport</h2>
            </div>
            <p class="small text-muted">Join the leading ESG reporting platform.</p>
        </div>

        <form action="dashboard.html">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" placeholder="John" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" placeholder="Doe" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Company Name</label>
                    <input type="text" class="form-control" placeholder="Acme Corporation" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Work Email Address</label>
                    <input type="email" class="form-control" placeholder="john@company.com" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Industry Sector</label>
                    <select class="form-select" required>
                        <option value="" disabled selected>Select your sector</option>
                        <option>Manufacturing</option>
                        <option>Technology</option>
                        <option>Financial Services</option>
                        <option>Energy & Utilities</option>
                        <option>Retail & Consumer Goods</option>
                    </select>
                </div>
            </div>

            <div class="mt-4">
                <p class="extra-small opacity-50 mb-4" style="font-size: 0.75rem;">By signing up, you agree to our <a href="#" class="text-white">Terms of Service</a> and <a href="#" class="text-white">Privacy Policy</a>.</p>
                <button type="submit" class="btn btn-auth-primary">Create Account</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <p class="small opacity-50 mb-0">Already have an account? <a href="login.html" class="text-accent">Sign In</a></p>
        </div>
    </div>

    <button id="backToTop"><i class="bi bi-arrow-up"></i></button>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
