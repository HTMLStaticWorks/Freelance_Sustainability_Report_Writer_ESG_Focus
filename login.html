<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EcoReport ESG</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <!-- CSS & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #062624 0%, #0c3e3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            color: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .auth-logo {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: white !important;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: var(--teal) !important;
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.15) !important;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .btn-auth-primary {
            background-color: #D4A017;
            border: none;
            color: #000;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s ease;
        }
        .btn-auth-primary:hover {
            background-color: #e5ae1a;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(212, 160, 23, 0.3);
        }
        .form-check-input {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .form-check-input:checked {
            background-color: var(--teal);
            border-color: var(--teal);
        }
        .btn-social {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            padding: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1;
            transition: all 0.2s ease;
        }
        .btn-social:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: white;
        }
        .auth-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .text-accent {
            color: #D4A017;
            text-decoration: none;
            font-weight: 600;
        }
        .text-accent:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="auth-logo">
                <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 2L4 8V24L16 30L28 24V8L16 2Z" stroke="var(--teal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 10V22" stroke="var(--teal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 14L22 10" stroke="var(--teal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 14L10 10" stroke="var(--teal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h2 class="fw-bold mb-1" style="color: white !important;">EcoReport</h2>
            <p class="small opacity-50">Welcome back to the dashboard.</p>
        </div>

        <form action="dashboard.html">
            <div class="mb-4">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="name@company.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label small opacity-75" for="remember">Remember Me</label>
                </div>
                <a href="#" class="text-accent small">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-auth-primary">Sign In</button>
        </form>

        <div class="text-center mt-4 mb-4">
            <p class="small opacity-50 mb-0">Don't have an account? <a href="register.html" class="text-accent">Register</a></p>
        </div>

        <div class="d-flex gap-3 mt-4">
            <button class="btn btn-social"><i class="bi bi-google"></i> Google</button>
            <button class="btn btn-social"><i class="bi bi-apple"></i> Apple</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
