<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EcoReport ESG</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <!-- CSS & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <style>
        body {
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: var(--transition-slow);
        }
        [data-theme="light"] body {
            background: linear-gradient(135deg, #f0fdfa 0%, #e0f2f1 100%);
        }
        [data-theme="dark"] body {
            background: linear-gradient(135deg, #061e1c 0%, #0c0f16 100%);
        }
        .auth-card {
            background: var(--bg-white);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            color: var(--text-main);
            box-shadow: var(--shadow-lg);
            transition: var(--transition-slow);
        }
        [data-theme="dark"] .auth-card {
            background: rgba(15, 23, 42, 0.8) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }
        .auth-logo {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .form-control {
            background: var(--bg-light) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.2s ease;
        }
        [data-theme="dark"] .form-control {
            background: rgba(255, 255, 255, 0.05) !important;
        }
        .form-control:focus {
            border-color: var(--teal) !important;
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.15) !important;
        }
        .btn-auth-primary {
            background-color: #D4A017;
            border: none;
            color: #000;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s ease;
        }
        .btn-auth-primary:hover {
            background-color: #e5ae1a;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(212, 160, 23, 0.3);
        }
        .btn-social {
            background: var(--bg-light);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 12px;
            padding: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1;
            transition: all 0.2s ease;
        }
        .btn-social:hover {
            background: var(--border-color);
            color: var(--text-main);
        }
        .text-accent {
            color: #D4A017;
            text-decoration: none;
            font-weight: 600;
        }
        .text-accent:hover {
            text-decoration: underline;
        }
        
        /* Mobile specific fix for Remember Me / Forgot Password */
        @media (max-width: 480px) {
            .auth-options {
                flex-wrap: nowrap !important;
                gap: 5px !important;
            }
            .form-check-label, .text-accent.small {
                font-size: 0.75rem !important;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="auth-brand">
                <div class="auth-logo-icon">
                    <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 2L4 8V24L16 30L28 24V8L16 2Z" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 10V22" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 14L22 10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 14L10 10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h2 class="fw-bold mb-0">EcoReport</h2>
            </div>
            <p class="small text-muted">Welcome back to the dashboard.</p>
        </div>

        <form action="dashboard.html">
            <div class="mb-4">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="name@company.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 auth-options">
                <div class="form-check p-0 ms-4">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label small text-muted" for="remember">Remember Me</label>
                </div>
                <a href="#" class="text-accent small">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-auth-primary">Sign In</button>
        </form>

        <div class="text-center mt-4 mb-4">
            <p class="small opacity-50 mb-0">Don't have an account? <a href="register.html" class="text-accent">Register</a></p>
        </div>

        <div class="d-flex gap-3 mt-4">
            <button class="btn btn-social"><i class="bi bi-google"></i> Google</button>
            <button class="btn btn-social"><i class="bi bi-apple"></i> Apple</button>
        </div>
    </div>

    <button id="backToTop"><i class="bi bi-arrow-up"></i></button>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
